<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f6b45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ラスベガス">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="backend-firebase.js"></script>
</head>
<body>
<title>ラスベガス計算</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-column scorecard. Sticky tab bar, hole card, result strip, totals table. */
:root{
  --bg:#f3f5f0; --card:#ffffff; --fg:#1d2a22; --muted:#66746b; --line:#d9e0d8;
  --accent:#1f6b45; --accent-soft:#e2efe6; --mine:#fff1c2; --teamA:#1756c9; --teamA-soft:#d9e5fb;
  --teamB:#cf2f3a; --teamB-soft:#fbdcde; --gold:#a8861c; --danger:#b23a3a;
  --font-body:"Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-num:"Barlow Condensed", "Arial Narrow", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --card:#1b231e; --fg:#e7ede8; --muted:#9aa89f; --line:#2c3830;
  --accent:#5cc28c; --accent-soft:#1f3328; --mine:#3d3417; --teamA:#6ea2ff; --teamA-soft:#1a2a4a;
  --teamB:#ff6b74; --teamB-soft:#4a1c22; --gold:#e0bd52; --danger:#ec7a7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --card:#1b231e; --fg:#e7ede8; --muted:#9aa89f; --line:#2c3830;
  --accent:#5cc28c; --accent-soft:#1f3328; --mine:#3d3417; --teamA:#6ea2ff; --teamA-soft:#1a2a4a;
  --teamB:#ff6b74; --teamB-soft:#4a1c22; --gold:#e0bd52; --danger:#ec7a7a; color-scheme:dark}
*{box-sizing:border-box}
html,body,*{touch-action:manipulation} /* ダブルタップで拡大しない（指2本の拡大はできる） */
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;flex-direction:column;gap:10px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.02em}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.helpbtn{font:inherit;font-size:14px;font-weight:700;color:var(--accent);background:var(--card);border:1.5px solid var(--accent);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;min-height:36px}
.helpv{font-size:16px;line-height:1.7}
.htitle{font-size:20px}
.hsec{border-top:1px solid var(--line);padding:4px 0}
.hsec summary{font-weight:700;font-size:17px;padding:10px 0;cursor:pointer;color:var(--accent)}
.hbody p{margin:6px 0}
.hbody ul{margin:6px 0;padding-left:1.2em}
.hbody dl{margin:6px 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.hbody dt{font-weight:700}
.hbody dd{margin:0}
.hbody dl.faq{display:block}
.hbody dl.faq dt{margin-top:10px}
.hbody dl.faq dd{margin:2px 0 0}
.hbody .ex{background:var(--accent-soft);border-radius:8px;padding:8px 10px}
@media (max-width:420px){.hbody dl{grid-template-columns:1fr}.hbody dd{margin:0 0 6px}}
h1 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-weight:700;padding:8px 0;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.label{font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.opt{display:flex;flex-direction:column;gap:8px}
.optitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;background:var(--bg)}
.optitem.on{border-color:var(--accent);background:var(--accent-soft)}
.optitem b{display:block}
.optitem span{font-size:12.5px;color:var(--muted)}
.optitem input{margin-top:4px;accent-color:var(--accent)}
.hcpgrid{display:grid;gap:8px}
.hcpp{background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:6px}
.hcpp .hname{font-weight:700}
.hcpp .parh{padding:0}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:11px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{border-color:var(--danger);background:transparent;color:var(--danger)}
.btn:focus-visible,.chip:focus-visible,.tabs button:focus-visible,.step button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.holenav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.holenav .num{font-family:var(--font-num);font-size:40px;font-weight:700;line-height:1;text-align:center}
.holenav .num small{font-size:16px;color:var(--muted);margin-left:2px}
.navbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:20px;cursor:pointer}
.navbtn:disabled{opacity:.3}
.pairline{font-size:13px;text-align:center;color:var(--muted)}
.scard{display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.scard.me{background:var(--mine);margin:0 -8px;padding:8px 8px 14px;border-radius:10px}
.schead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.schead b{font-size:19px}
.sctot{margin-left:auto;font-family:var(--font-num);font-size:26px;font-weight:700;background:var(--teamA);color:var(--card);padding:0 10px;border-radius:6px}
.sctot small{font-size:18px;font-weight:500;margin-left:2px}
.scg{display:grid;grid-template-columns:repeat(9,minmax(0,1fr)) minmax(0,1.4fr);border:1px solid var(--line);border-radius:6px;overflow:hidden;font-variant-numeric:tabular-nums}
.scg>div{text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.scg>div:nth-child(10n){border-right:0}
.scg .sh{background:var(--accent);color:var(--card);font-family:var(--font-num);font-size:17px;font-weight:700;padding:2px 0}
.scg .sp{background:var(--bg);color:var(--muted);font-size:13px;padding:1px 0}
.scg .sv{background:var(--card);font-family:var(--font-num);font-size:20px;font-weight:700;min-height:34px;display:flex;align-items:center;justify-content:center;border-bottom:0}
.scg .sv.tot{font-size:22px}
.scg .spt{border-top:1px solid var(--line);border-bottom:0;color:var(--accent);font-family:var(--font-num);font-size:14px;font-weight:700;min-height:20px}
.sumhead{font-size:19px;font-weight:800;margin:22px 4px 8px;padding-left:10px;border-left:5px solid var(--accent);line-height:1.3}
.sumhead small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.mk{font-family:var(--font-body);font-size:20px;font-weight:400;line-height:1}
.mk.sq{font-size:27px}
.hsel{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.hs{font:inherit;font-family:var(--font-num);font-size:18px;font-weight:700;line-height:1.05;padding:5px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;min-height:44px}
.hs small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.hs[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--card)}
.hs[aria-pressed="true"] small{color:var(--card)}
tr.sub td{background:var(--accent-soft);font-weight:700;border-bottom:2px solid var(--line)}
tr.sub td:first-child{color:var(--accent)}
.ordwarn{display:block;width:100%;font:inherit;text-align:center;font-weight:700;font-size:18px;line-height:1.4;color:var(--card);background:var(--danger);border:0;border-radius:12px;padding:14px 12px;cursor:pointer}
.ordwarn small{display:block;font-size:13px;font-weight:500;opacity:.9;margin-top:2px}
#par{gap:10px}
#par .chip{min-width:76px;min-height:44px;font-size:19px;font-weight:700;font-family:var(--font-num)}
/* ---- 主催者・プレーヤー・ギャラリー ---- */
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rolebtn{font:inherit;font-weight:700;font-size:17px;padding:12px 4px;border-radius:12px;border:2px solid var(--accent);background:var(--card);color:var(--accent);cursor:pointer;min-height:48px}
.rolebtn[aria-pressed="true"]{background:var(--accent);color:var(--card)}
.note.demo{color:var(--gold)}
.evhead{display:flex;flex-direction:column;gap:2px}
.evhead b{font-size:19px}
.coderow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.coderow input{font-family:var(--font-num);font-size:26px;letter-spacing:.3em;text-align:center}
.or{text-align:center;color:var(--muted);font-size:13px}
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pbtn{font:inherit;font-weight:700;font-size:16px;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;min-height:48px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pbtn small{font-size:12px;font-weight:500;color:var(--muted)}
.pbtn.on{background:var(--accent);border-color:var(--accent);color:var(--card)} .pbtn.on small{color:var(--card)}
.pbtn:disabled{opacity:.45;cursor:not-allowed}
.ask{font-size:17px}
.card.linked{border:2px solid var(--accent)}
.bigcode{font-family:var(--font-num);font-size:56px;font-weight:700;letter-spacing:.2em;text-align:center;color:var(--accent);line-height:1}
.endrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:stretch;margin-top:10px}
.endrow.noback{grid-template-columns:auto 1fr}
.btn.big{font-size:17px;padding-top:14px;padding-bottom:14px}
.joinask{display:grid;gap:10px;margin-top:10px}
.copyset{display:grid;gap:8px;margin:8px 0 4px}
.urlrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.url{font-family:var(--font-num);font-size:16px;word-break:break-all;-webkit-user-select:all;user-select:all;min-width:0;flex:1 1 200px}
.grow{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.pgrid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr)) minmax(0,1.3fr);gap:3px}
.pc{font:inherit;font-family:var(--font-num);font-size:13px;color:var(--muted);line-height:1.1;padding:4px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;min-height:48px;text-align:center}
.pc b{display:block;font-size:22px;color:var(--fg)}
.pc.tot{background:var(--bg);cursor:default}
.warnTxt{color:var(--danger);font-weight:700}
.regmsg{font-size:17px;font-weight:700;color:var(--danger)}
input[type=email]{font:inherit;font-size:17px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.parfix{font-family:var(--font-num);font-size:24px}
.rank{display:flex;flex-direction:column}
.rhead,.rrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto 40px;gap:8px;align-items:center}
.rhead{font-size:12px;color:var(--card);background:var(--teamA);padding:6px 8px;border-radius:8px 8px 0 0;font-weight:700}
.rrow{font:inherit;color:var(--fg);background:var(--card);border:0;border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;cursor:pointer;width:100%}
.rrow.mine{background:var(--mine)}
.rrow.open{background:var(--accent-soft)}
.rn{font-family:var(--font-num);font-size:22px;font-weight:700;text-align:center}
.rname{font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsc{font-family:var(--font-num);font-size:22px;font-weight:700;background:var(--teamA);color:var(--card);border-radius:6px;padding:0 10px;white-space:nowrap;letter-spacing:.08em}
.rsc small{font-size:15px;font-weight:500;margin-left:8px;letter-spacing:.06em}
.rh{font-family:var(--font-num);font-size:20px;font-weight:700;text-align:center}
.ropen{padding:8px 0}
.nw{white-space:nowrap}
.pbtn.taken{background:var(--line);color:var(--muted);border-color:var(--line)}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);background:var(--card);vertical-align:-1px;margin-right:3px}
.swatch.taken{background:var(--line)}
.pickbox{display:flex;flex-direction:column;gap:8px;border:2px solid var(--accent);border-radius:10px;padding:10px}
.editbox{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.elist{display:flex;flex-direction:column;gap:6px}
.erow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.erow.nrow{grid-template-columns:2.2em minmax(0,1fr) auto}
.nno{text-align:right;font-family:var(--font-num);font-weight:700;color:var(--muted)}
.btn.addrow{background:var(--accent);border-color:var(--accent);color:var(--card);margin-top:8px;width:100%}
.onoff .chip{min-width:96px;min-height:44px;font-size:18px;font-weight:700}
.secbtn{display:flex;justify-content:space-between;align-items:center;font-size:18px;padding:14px 16px}
.secbtn span{font-size:14px;font-weight:500;opacity:.9}
.btn.ordbtn{background:var(--danger);border-color:var(--danger);color:var(--card)}
.ordnow{display:flex;flex-wrap:wrap;gap:6px 14px}
.ordnow span{display:flex;align-items:center;gap:6px;font-weight:700}
.ordnow b{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--card);font-family:var(--font-num);font-size:15px}
.ordnow .empty{color:var(--muted)} .ordnow .empty b{background:var(--line);color:var(--muted)}
.pairline.order{font-size:17px;color:var(--fg)}
.player{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px;border-radius:10px}
.player.A{background:var(--teamA-soft);border-left:6px solid var(--teamA)}
.player.B{background:var(--teamB-soft);border-left:6px solid var(--teamB)}
.player.A .tag,.player.B .tag{align-self:flex-start;color:var(--card);padding:1px 8px;border-radius:999px;margin-bottom:2px}
.player.A .tag{background:var(--teamA)} .player.B .tag{background:var(--teamB)}
.player.none{background:var(--bg)}
.pname{font-weight:700;display:flex;flex-direction:column;min-width:0;font-size:19px;line-height:1.35}
.pname .tag{font-size:12.5px;font-weight:700;letter-spacing:.06em}
.A .tag{color:var(--teamA)} .B .tag{color:var(--teamB)}
.pname .sub{font-size:13.5px;color:var(--muted);font-weight:400}
.badge{display:inline-block;font-size:14px;padding:1px 9px;vertical-align:2px;border-radius:999px;background:var(--gold);color:var(--card);margin-left:4px;font-weight:700}
.step{display:flex;align-items:center;gap:4px}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:20px;cursor:pointer}
.step .val{font-family:var(--font-num);font-size:30px;font-weight:700;width:42px;text-align:center;font-variant-numeric:tabular-nums}
.hh{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);grid-column:1/-1}
.hh input{width:64px;padding:4px 8px}
.result{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--card)}
.result .big{font-family:var(--font-num);font-size:30px;font-weight:700;line-height:1.1}
.bd{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;font-size:13.5px;font-variant-numeric:tabular-nums}
.bd .k{color:var(--muted)}
.bd .p{font-family:var(--font-num);font-size:17px;font-weight:600;text-align:right}
.note{font-size:12.5px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:6px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:14px;color:var(--muted);font-weight:700}
td.num{font-family:var(--font-num);font-size:21px}
table.lvt{table-layout:fixed}
table.lvt th:first-child{width:78px}
table.lvt :is(th,td):first-child{padding-left:4px;padding-right:2px}
table.lvt :is(th,td):not(:first-child){padding-left:0;padding-right:8px}
table.lvt thead th:not(:first-child){font-size:13px;line-height:1.25;vertical-align:bottom}
table.lvt .nmfit{display:block;white-space:nowrap;overflow:hidden}
tr.total td{font-weight:700;border-top:2px solid var(--fg)}
tr.total td:first-child{font-size:12px;line-height:1.3}
tr.total td.num{font-size:30px;font-weight:800;line-height:1.1;padding-top:10px;padding-bottom:10px}
tr.namerow td{color:var(--muted);font-weight:700;vertical-align:bottom;padding-top:12px}
.pos{color:var(--teamA)} .neg{color:var(--teamB)}
.parh{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 12px;padding:2px 0 6px}
.mini-step{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted)}
.mini-step button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px;cursor:pointer}
.mini-step b{font-family:var(--font-num);font-size:20px;color:var(--fg);min-width:18px;text-align:center}
.sc{font-size:14px;color:var(--muted);line-height:1.2}
.hc{margin-left:3px;color:var(--gold);font-weight:700}
.hbtn{font:inherit;font-weight:700;font-size:13px;color:var(--accent);background:var(--card);border:1.5px solid var(--accent);border-radius:8px;padding:3px 6px;cursor:pointer;white-space:nowrap}
.hcell{display:inline-grid;grid-template-columns:auto auto;gap:3px 5px;align-items:center;justify-items:start;white-space:nowrap}

<div class="wrap">
  <header>
    <div class="hrow"><h1>ラスベガス<small>ローカルルール版</small></h1><button class="helpbtn" id="helpBtn">？使い方</button></div>
    <div class="tabs" role="tablist">
      <button id="tab-setup" role="tab" data-v="setup">設定</button>
      <button id="tab-hole" role="tab" data-v="hole">スコア</button>
      <button id="tab-sum" role="tab" data-v="sum">集計</button>
      <button id="tab-hist" role="tab" data-v="hist">履歴</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<script>
const HOLES=18;
const LS='vegas-local-v1';
const today=()=>new Date().toLocaleDateString('sv-SE');
const clone=o=>JSON.parse(JSON.stringify(o));
function blankHole(){return {par:4,s:[null,null,null,null],h:[0,0,0,0],partner:null,np:null,carry:0,mult:1,putt:null};}
function blankHoles(){return Array.from({length:HOLES},blankHole);}
function defaultSetup(){return {me:null,date:'',course:'',names:['Aさん','Bさん','Cさん','Dさん'],order:[0,1,2,3],orderSet:false,lvSeen:false,mpSeen:false,lvOn:false,mpOn:false,puttOn:false,mode:'rotate',fixedPartner:1,
  hcp:['none','none','none','none'],hcpPar:[0,1,2,3].map(()=>({3:0,4:1,5:2})),split:false,
  hcp2:['none','none','none','none'],hcpPar2:[0,1,2,3].map(()=>({3:0,4:1,5:2})),
  mp:defaultMp()};}
// マッチプレー：opps=対戦する同伴者, ext=場外の人のid(4〜), names/xs=場外の人の名前とスコア, mh=対戦ごとのハンデ
function defaultMp(){return {opps:[],ext:[],names:{},xs:{},mh:{},cap:true,lk:{}};}
function fixSetup(s){if(s.lvOn===undefined) s.lvOn=true; if(s.puttOn===undefined) s.puttOn=s.me!=null; if(s.mpOn===undefined) s.mpOn=!!(s.mp&&((s.mp.opps||[]).length||(s.mp.ext||[]).length));
  const d=defaultSetup(); for(const k in d) if(s[k]==null&&k!=='me') s[k]=clone(d[k]); if(s.me===undefined) s.me=null; delete s.rate;
  const dm=defaultMp(); for(const k in dm) if(s.mp[k]==null) s.mp[k]=clone(dm[k]); return s;}
function fixHoles(hs){return Array.from({length:HOLES},(_,i)=>Object.assign(blankHole(),hs&&hs[i]||{}));}

/* ---------- per-viewer state (this phone only) ---------- */
let L=null;
try{L=JSON.parse(localStorage.getItem(LS));}catch(e){}
if(!L||typeof L!=='object') L={};
if(!L.local){L.local={setup:L.setup||defaultSetup(),holes:L.holes||blankHoles()};delete L.setup;delete L.holes;}
fixSetup(L.local.setup); L.local.holes=fixHoles(L.local.holes);
L.view=L.view||'setup'; L.cur=L.cur||0; L.history=L.history||[]; L.role=L.role||'player';
if(L.view==='sum'&&false) L.view='sum';
function saveL(){try{localStorage.setItem(LS,JSON.stringify(L));}catch(e){}}

/* ---------- shared state ---------- */
let db=null,user=null,myId=null,canWrite=null,ready=false;
let shared=null;          // {id,data:{setup,holes},meta:{date,createdBy,createdAt},ended:false}
let unsubRound=null,todayRounds=[],dbHistory=[];
let pending=null,flushing=false,writeErr='';
let endStep=null, histOpen=null, histDel=null, toast='';
let extOpen=null, extDel=null, ordPick=null;

let R=L.local;            // the round currently on screen
function cur(){return shared&&shared.data?shared.data:L.local;}

/* ---------- rules ---------- */
// 1Hは設定で選んだオナー順。2H目からは前ホールの実スコア順
function honorOrder(i){const so=R.setup.order; let o=(Array.isArray(so)&&so.length===4?so:[0,1,2,3]).slice();
  const act=R.setup.lvOn?[0,1,2,3]:[0,1,2,3].filter(slotOn); // ラスベガスをしない時は、使っている欄だけで決める
  o=o.filter(k=>act.includes(k)).concat(o.filter(k=>!act.includes(k)));
  for(let j=0;j<i;j++){const s=R.holes[j].s; if(act.some(k=>s[k]==null)) continue;
    o=o.slice().sort((a,b)=>(act.includes(a)?0:1)-(act.includes(b)?0:1)||(act.includes(a)?s[a]-s[b]:0));}
  return o;}
function ordActive(){return R.setup.lvOn?[0,1,2,3]:[0,1,2,3].filter(slotOn);}
function teams(i){
  const m=R.setup.mode;
  if(m==='rotate'){const o=honorOrder(i); const A=[o[0],o[[1,2,3][i%3]]]; return {A,B:o.filter(x=>!A.includes(x)),order:o};}
  const p=m==='fixed'?R.setup.fixedPartner:R.holes[i].partner; if(p==null) return null;
  return {A:[0,p],B:[1,2,3].filter(x=>x!==p)};}
function hcfg(i){const b=R.setup.split&&i>=9; return {type:b?R.setup.hcp2:R.setup.hcp, par:b?R.setup.hcpPar2:R.setup.hcpPar};}
function hcpOf(i,k){const c=hcfg(i), t=c.type[k]; if(t==='all1') return 1;
  if(t==='par') return Number(c.par[k][R.holes[i].par])||0;
  if(t==='hole') return Number(R.holes[i].h[k])||0; return 0;}
// ハンデを引いてもパーより良くはならない
function net(i,k){const g=R.holes[i].s[k], par=R.holes[i].par; if(g==null) return null;
  return g>par?Math.max(par,g-hcpOf(i,k)):g;}
function usedHcp(i,k){const g=R.holes[i].s[k]; return g==null?0:g-net(i,k);}
// パーとの差で表示（ハンデを引く前の実際のスコア）
function scoreBadge(g,par){ if(g==null) return '';
  const d=g-par; let t;
  if(g===1) t='ホールインワン'; else if(d<=-3) t='アルバトロス'; else if(d===-2) t='イーグル'; else if(d===-1) t='バーディー';
  else if(d===0) t='パー'; else if(d===1) t='ボギー'; else if(d===2) t='Dボギー'; else t='+'+d;
  const cls=d<0?'badge':d===0?'badge par':'badge over';
  return `<span class="${cls}">${t}</span>`;}
function isBirdie(i,k){const g=R.holes[i].s[k]; return g!=null && g<=R.holes[i].par-1;}
function compute(i){
  const t=teams(i); if(!t) return null;
  const H=R.holes[i]; if(H.s.some(v=>v==null)) return null;
  const nA=t.A.map(k=>net(i,k)), nB=t.B.map(k=>net(i,k));
  const birA=t.A.some(k=>isBirdie(i,k)), birB=t.B.some(k=>isBirdie(i,k));
  let fa=Math.min(...nA), ba=Math.max(...nA), fb=Math.min(...nB), bb=Math.max(...nB);
  if(birB){[fa,ba]=[ba,fa];}
  if(birA){[fb,bb]=[bb,fb];}
  // 後は「前で勝ったチームが後も勝ったときだけ」+1。前で負けたチームが後で勝っても点は動かない。前が同点なら後で勝ったチームに+1
  const front=fb-fa, bw=ba<bb?1:(bb<ba?-1:0);
  const back=front===0?bw:(front>0&&bw>0?1:(front<0&&bw<0?-1:0));
  let np=0; if(H.np!=null){np=t.A.includes(H.np)?1:-1;}
  // バーディー賞：バーディー以上の人1人につきそのチームに+1（両チームに出たら相殺）
  const bir=t.A.filter(k=>isBirdie(i,k)).length-t.B.filter(k=>isBirdie(i,k)).length;
  const base=front+back+np+bir, mult=Number(H.mult)||1, carry=Number(H.carry)||0;
  const prod=base*mult, ptsA=prod>0?prod+carry:prod<0?prod-carry:0;
  return {t,fa,ba,fb,bb,birA,birB,front,back,np,bir,base,mult,carry,ptsA};
}
function playerPts(i){const r=compute(i); if(!r) return null;
  const out=[0,0,0,0]; r.t.A.forEach(k=>out[k]=r.ptsA); r.t.B.forEach(k=>out[k]=-r.ptsA); return out;}
function totals(){const tot=[0,0,0,0],gro=[0,0,0,0],hc=[0,0,0,0],w=[0,0,0,0],l=[0,0,0,0],d=[0,0,0,0];let played=0;
  for(let i=0;i<HOLES;i++){const p=playerPts(i); if(p){p.forEach((v,k)=>{tot[k]+=v; if(v>0)w[k]++; else if(v<0)l[k]++; else d[k]++;});played++;}
    for(let k=0;k<4;k++){const g=R.holes[i].s[k]; if(g!=null){gro[k]+=g;hc[k]+=usedHcp(i,k);}}}
  return {tot,gro,hc,w,l,d,played};}
// 前半（1〜9H）・後半（10〜18H）の小計
function halfTotals(a,b){const tot=[0,0,0,0],gro=[0,0,0,0];let putt=0;
  for(let i=a;i<=b;i++){const p=playerPts(i); if(p) p.forEach((v,k)=>tot[k]+=v);
    for(let k=0;k<4;k++){const g=R.holes[i].s[k]; if(g!=null) gro[k]+=g;} if(R.holes[i].putt!=null) putt+=R.holes[i].putt;}
  return {tot,gro,putt};}
// スコアカード（実際のスコア・ハンデなし）。—パー △ボギー □Dボギー ○バーディー ◎イーグル以下 +3以上は数字
function scMark(g,par){if(g==null) return '';const d=g-par;
  if(d<=-2) return '<span class="mk">◎</span>'; if(d===-1) return '<span class="mk">○</span>'; if(d===0) return '<span class="mk">—</span>';
  if(d===1) return '<span class="mk">△</span>'; if(d===2) return '<span class="mk sq">□</span>'; return '+'+d;}
const PT=()=>!!(R.setup.puttOn&&R.setup.me!=null); // 自分のパット数を記録する時だけ
function scoreCards(){const pars=R.holes.map(H=>H.par);
  return [0,1,2,3].filter(slotOn).map(k=>cardFor(N(k),R.holes.map(H=>H.s[k]),pars,R.setup.me===k,PT()&&R.setup.me===k?R.holes.map(H=>H.putt):null)).join('')
    +`<div class="note">実際のスコア（ハンデなし）。—パー、△ボギー、□ダブルボギー、○バーディー、◎イーグル。+3はパーより3打多い。${PT()?'自分の欄の下の段はパット数。':''}</div>`;}
function withR(r,f){const o=R;R=r;try{return f();}finally{R=o;}}
const N=k=>R.setup.names[k]||('P'+(k+1));
// 使っている欄か（2人・3人の組では、名前のない欄・空きの欄は表示しない）
const slotOn=k=>{const n=String(R.setup.names[k]||'').trim(); return n!==''&&n!=='（空き）';};
const sign=v=>v>0?'+'+v:String(v);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- match play (自分 vs 相手・1対1) ---------- */
const isExt=k=>k>=4;
const MN=k=>isExt(k)?(R.setup.mp.names[k]||'場外'):N(k);
// 場外の相手がIDの参加者なら、共有のスコアを自動で使う
const mpSc=(i,k)=>{if(!isExt(k)) return R.holes[i].s[k]??null; const lk=R.setup.mp.lk&&R.setup.mp.lk[k];
  if(lk&&curEv&&R===L.local) return (curEv.scores[lk]||[])[i]??null; return (R.setup.mp.xs[k]||[])[i]??null;};
function mpMatches(){const s=R.setup, me=s.me; if(me==null||!s.mp||!s.mpOn) return [];
  return s.mp.opps.filter(o=>o!==me&&o<4).concat(s.mp.ext).map(o=>({a:me,b:o}));}
// ハンデは対戦ごと。who: none=なし / me=自分がもらう / opp=相手がもらう
// mode: par=パー3・4・5ごと / holes=選んだホールで各1打
const mhOf=o=>{const h=R.setup.mp.mh[o]; return h&&h.v?{mode:'par',holes:[],...h}:{who:'none',v:{3:0,4:0,5:0},mode:'par',holes:[]};};
function mpHc(i,k,m){const h=mhOf(m.b); if(!((h.who==='me'&&k===m.a)||(h.who==='opp'&&k===m.b))) return 0;
  if(h.mode==='holes') return h.holes.includes(i)?1:0;
  return Number(h.v[R.holes[i].par])||0;}
function mpNet(i,k,m){const g=mpSc(i,k),par=R.holes[i].par,h=mpHc(i,k,m); if(g==null) return null;
  if(!R.setup.mp.cap) return g-h; return g>par?Math.max(par,g-h):g;}
// up>0 なら自分がリード。残りホール数より差が大きくなったら決着、それ以降は数えない
function mpRun(m,upto){upto=upto==null?HOLES-1:upto; let up=0,dec=null,last=-1; const w=[0,0,0], cells=[];
  for(let i=0;i<HOLES;i++){
    if(i>upto){cells.push(null);continue;}
    const na=mpNet(i,m.a,m), nb=mpNet(i,m.b,m);
    if(na==null||nb==null){cells.push(null);continue;}
    const r=na<nb?1:nb<na?-1:0, after=!!dec;
    if(!after){up+=r; last=i; w[r===1?0:r===-1?1:2]++;}
    cells.push({r,up,after});
    const rem=HOLES-1-i; if(!dec&&Math.abs(up)>rem) dec={i,rem};}
  return {cells,up,dec,last,w};}
function mpStatus(x){const n=Math.abs(x.up), W=x.up>0;
  if(x.last<0) return 'まだスコアがありません';
  if(x.dec) return x.dec.rem>0?`${W?'勝ち':'負け'}（${n}&${x.dec.rem}）`:`${W?'勝ち':'負け'}（${n}${W?'アップ':'ダウン'}）`;
  const rem=HOLES-1-x.last;
  if(x.up===0) return rem===0?'引き分け':'オールスクエア（同点）';
  return `${n}${W?'アップ':'ダウン'}${n===rem?'（ドーミー）':''}`;}
const mpCol=x=>x.up>0?'var(--teamA)':x.up<0?'var(--teamB)':'var(--fg)';
const mpTag=k=>(R.setup.me===k?'<span class="metag">自分</span>':'')+(isExt(k)?'<span class="ext">場外</span>':'');
const mpVs=m=>`<b class="na">${esc(MN(m.a))}</b>${mpTag(m.a)} <span class="vs">vs</span> <b class="nb">${esc(MN(m.b))}</b>${mpTag(m.b)}`;
function mpSummary(clickable){const ms=mpMatches(); if(!ms.length) return '';
  return `<div class="mlist">${ms.map(m=>{const x=mpRun(m);
    return `<div class="mblock"><div class="mhead"><span>${mpVs(m)}</span><span class="note">自分 ${x.w[0]}勝・${esc(MN(m.b))} ${x.w[1]}勝・分け${x.w[2]}</span></div>
      <div class="mbig" style="color:${mpCol(x)}">${esc(mpStatus(x))}</div>
      <div class="mgrid">${x.cells.map((c,i)=>`<div class="mc ${!c?'':c.after?'off':c.r>0?'a':c.r<0?'b':''} ${clickable&&i===L.cur?'cur':''}" ${clickable?`data-go="${i}"`:''}>${i+1}<b>${!c?'·':c.after?'–':c.up===0?'AS':Math.abs(c.up)}</b></div>`).join('')}</div></div>`;}).join('')}</div>
    <div class="note">マスの色＝そのホールに勝った人（<span class="na">青</span>は自分、<span class="nb">赤</span>は相手、白は引き分け）。数字＝その時点で何ホールリードしているか。AS＝同点。薄いマスは決着後。</div>`;}
function mpText(){return mpMatches().map(m=>`マッチ 自分 vs ${MN(m.b)}：${mpStatus(mpRun(m))}`);}

/* ---------- writing: local or shared ---------- */
function deepMerge(a,b){for(const k in b){const v=b[k];
  if(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k])) deepMerge(a[k],v); else a[k]=clone(v);} return a;}
const readOnly=()=>!!(shared&&canWrite===false);
// apply: change R in place.  patch: the same change in shared-document form
function mutate(apply,patch){
  if(readOnly()) return;
  apply(R);
  if(shared){pending=pending?deepMerge(pending,patch):clone(patch); flush();}
  else saveL();
  render();
}
async function flush(){
  if(flushing||!shared) return; flushing=true;
  while(pending&&shared){const p=pending; pending=null;
    try{await db.doc('rounds/'+shared.id).update(p); writeErr='';}
    catch(e){
      if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*800));
        try{await db.doc('rounds/'+shared.id).update(p);writeErr='';continue;}catch(e2){e=e2;}}
      if(e&&e.code==='invalid_argument'){canWrite=false; writeErr='この画面では入力できません（見るだけの権限です）。';}
      else writeErr='保存できませんでした。電波の良いところでもう一度入力してください。';
      render();
    }}
  flushing=false;
}
const holePatch=(i,o)=>({holes:{[i]:o}});
function toDocHoles(holes){const m={};holes.forEach((h,i)=>{m[i]={par:h.par,s:{...h.s},h:{...h.h},partner:h.partner,np:h.np,carry:h.carry,mult:h.mult};});return m;}
function fromDoc(d){const dh=d.holes||{};
  return {setup:fixSetup(clone(d.setup||defaultSetup())),
    holes:Array.from({length:HOLES},(_,i)=>{const h=dh[i]||{};return {par:h.par||4,s:[0,1,2,3].map(k=>h.s&&h.s[k]!=null?h.s[k]:null),
      h:[0,1,2,3].map(k=>h.h&&h.h[k]||0),partner:h.partner??null,np:h.np??null,carry:h.carry||0,mult:h.mult||1};})};}

/* ---------- shared rounds ---------- */
function joinRound(id){
  if(unsubRound) unsubRound();
  shared={id,data:null,meta:null,ended:false}; L.roundId=id; saveL(); render();
  unsubRound=db.doc('rounds/'+id).onSnapshot(snap=>{
    if(!shared||shared.id!==id) return;
    if(!snap.exists){
      if(shared.data){shared.ended=true; endStep='ask';} else {leaveShared(); toast='そのラウンドは見つかりませんでした。';}
      remoteRender(); return;}
    const d=clone(snap.data()); if(pending) deepMerge(d,pending);
    shared.data=fromDoc(d); shared.meta={date:d.date,createdBy:d.createdBy,createdAt:d.createdAt};
    R=shared.data; remoteRender();
  },e=>{writeErr='共有データに接続できませんでした。';remoteRender();});
}
function leaveShared(){if(unsubRound) unsubRound(); unsubRound=null; shared=null; pending=null; L.roundId=null; R=L.local; saveL();}
async function createShared(){
  if(!db) return;
  const id='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const doc={date:today(),createdAt:Date.now(),createdBy:myId||'',setup:clone(L.local.setup),holes:toDocHoles(L.local.holes)};
  try{await db.doc('rounds/'+id).set(doc); joinRound(id); toast='共有を始めました。ほかの3人は「今日のラウンド」から参加できます。';}
  catch(e){toast=e&&e.code==='invalid_argument'?'共有できません（このアプリの編集権限が必要です）。':'共有を始められませんでした。もう一度お試しください。';}
  render();
}
const isHost=()=>!!(shared&&shared.meta&&myId&&shared.meta.createdBy===myId);

/* ---------- history ---------- */
function allHistory(){const a=HIST.slice();
  return a.sort((x,y)=>String(y.date||'').localeCompare(String(x.date||''))||(y.savedAt||0)-(x.savedAt||0));}
async function saveHistory(){
  const r=R, t=withR(r,totals);
  const rec={id:'h'+Date.now().toString(36),date:r.setup.date||(shared&&shared.meta&&shared.meta.date)||today(),savedAt:Date.now(),
    setup:clone(r.setup),holes:clone(r.holes),tot:t.tot,gro:t.gro};
  // IDで参加していたら、その時点の順位表と場外マッチのスコアも一緒に残す
  if(L.link&&curEv){rec.rank=rankRows(curEv); rec.pars=curEv.pars.slice(); rec.pid=L.link.pid; rec.evName=evTitle(curEv);
    const lk=rec.setup.mp.lk||{}; for(const id in lk){rec.setup.mp.xs[id]=(curEv.scores[lk[id]]||Array(HOLES).fill(null)).slice();} rec.setup.mp.lk={};}
  if(!REG) return false;
  try{await B.history.save(REG.uid,JSON.parse(JSON.stringify(rec))); return true;}catch(e){toast='履歴に保存できませんでした。電波の良い所でもう一度お試しください。'; return false;}
}
async function finishRound(keep){
  if(keep&&!(await saveHistory())){render(); return;}
  const setup=clone(R.setup);
  if(shared){ if(isHost()&&!shared.ended){try{await db.doc('rounds/'+shared.id).delete();}catch(e){}} leaveShared(); }
  L.link=null; L.pmode=null; curEv=null;
  L.local={setup:defaultSetup(),holes:blankHoles()}; R=L.local; L.cur=0; L.view='setup'; endStep=null; saveL(); window.scrollTo(0,0);
  toast=keep?'記録を保存しました。「履歴」から見られます。':'記録を消しました。';
  render();
}
function histText(rec){return withR(rec,()=>{const t=totals();
  return [`${rec.date} ${rec.setup.course||''}`.trim(),...[0,1,2,3].filter(slotOn).map(k=>R.setup.lvOn===false?`${N(k)}：スコア${t.gro[k]||'-'}`:`${N(k)}：${sign(t.tot[k])}pt（スコア${t.gro[k]||'-'}）`),...mpText()].join('\n');});}

let deferred=false;
function remoteRender(){const a=document.activeElement;
  if(a&&a.tagName==='INPUT'&&document.getElementById('view').contains(a)){deferred=true;return;} render();}
document.addEventListener('focusout',()=>{if(deferred){deferred=false;setTimeout(render,0);}});

// 画面の書き換え中にもう一度書き換えが起きたら（入力欄から指を離した瞬間など）、終わってからやり直す
let rendering=false;
function render(){
  if(rendering){setTimeout(render,0);return;}
  rendering=true; try{renderInner();}finally{rendering=false;}
}
function renderInner(){
  syncLinked(); if(L.role==='gallery'&&L.view!=='help') L.view='setup';
  document.querySelector('.tabs').hidden=L.role==='gallery';
  R=cur();
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===L.view));
  const v=document.getElementById('view');
  const top=banner();

  if(shared&&!shared.data) body=`<section class="card"><div class="note">共有ラウンドを読み込み中…</div></section>`;
  else body=L.view==='help'?vHelp():L.view==='setup'?vSetupAll():L.view==='hole'?vHole():L.view==='sum'?vSum():vHist();
  v.innerHTML=`<div class="wrap${L.view==='setup'?' setupv':''}" style="padding:0">${top}${body}</div>`;
  bind(); fitNames();
}

function fitNames(){document.querySelectorAll('table.lvt').forEach(tb=>{const els=[...tb.querySelectorAll('.nmfit')]; let min=16; const out=[];
  els.forEach(el=>{const th=el.parentElement, cs=getComputedStyle(th), w=(th.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight))*0.95;
    const ch=[...(el.dataset.n||(el.dataset.n=el.textContent))], n=ch.length||1; if(w<=0) return;
    let fs=Math.min(16,w/n), html=esc(ch.join(''));
    if(fs<11&&n>1){const h=Math.ceil(n/2); fs=Math.min(16,w/h); html=esc(ch.slice(0,h).join(''))+'<br>'+esc(ch.slice(h).join(''));}
    out.push([el,html]); min=Math.min(min,fs);});
  const f=Math.floor(min*2)/2+'px'; out.forEach(([el,html])=>{el.innerHTML=html; el.style.fontSize=f;});});}

/* ========== IDでの共有・登録・履歴 ==========
   保存先（バックエンド）は2種類。公開版（GitHub）では Firebase、ここ（試し用）ではこのスマホの中だけで動く仮の仕組み。
   どちらも同じ使い方（B.watch / B.createEvent など）にしてあるので、画面のプログラムは共通。 */
const SKEY='vegas-shared-demo-v1', MAXP=40;
const evStart=ev=>new Date(ev.date+'T00:00:00').getTime();
const evEnd=ev=>evStart(ev)+48*3600*1000;   // 開催日の0時から48時間で消える
function demoBackend(){
  const all=()=>{try{return JSON.parse(localStorage.getItem(SKEY))||{};}catch(e){return {};}};
  const save=a=>{try{localStorage.setItem(SKEY,JSON.stringify(a));}catch(e){}};
  const subs={}, notify=code=>(subs[code]||[]).forEach(cb=>cb(read(code)));
  const read=code=>{const a=all(), ev=a[code]; if(!ev) return null; if(Date.now()>evEnd(ev)){delete a[code]; save(a); return null;} return clone(ev);};
  const grp=(ev,p)=>Object.keys(ev.groups).find(k=>ev.groups[k].members.includes(p))||null;
  let regCb=null;
  const regGet=()=>{try{return JSON.parse(localStorage.getItem('vegas-demo-reg'));}catch(e){return null;}};
  const regSet=v=>{try{v?localStorage.setItem('vegas-demo-reg',JSON.stringify(v)):localStorage.removeItem('vegas-demo-reg');}catch(e){} if(regCb) regCb(v);};
  const hsubs=[], hnotify=()=>hsubs.forEach(cb=>cb(clone(L.history)));
  return {name:'demo',
    watch(code,cb){(subs[code]||(subs[code]=[])).push(cb); setTimeout(()=>cb(read(code)),0); return ()=>{subs[code]=subs[code].filter(x=>x!==cb);};},
    async createEvent(d){const a=all(); let code; do{code=String(1000+Math.floor(Math.random()*9000));}while(a[code]);
      a[code]={code,date:d.date,name:d.name,course:d.course,pars:d.pars.slice(),players:d.players.map((n,j)=>({id:'p'+(j+1),name:n})),groups:{},scores:{}}; save(a); return code;},
    async setScore(code,pid,i,v){const a=all(), ev=a[code]; if(!ev) return; (ev.scores[pid]||(ev.scores[pid]=Array(HOLES).fill(null)))[i]=v; save(a); notify(code);},
    async createGroup(code,me,picks){const a=all(), ev=a[code]; if(!ev) return {missing:true};
      if(grp(ev,me)) return {already:grp(ev,me)}; const taken=picks.filter(p=>grp(ev,p)); if(taken.length) return {taken};
      const gid=String(Math.max(0,...Object.keys(ev.groups).map(Number))+1); ev.groups[gid]={by:me,members:[me,...picks]}; save(a); notify(code); return {gid};},
    async removeFromGroup(code,pid){const a=all(), ev=a[code]; if(!ev) return; const k=grp(ev,pid); if(!k) return;
      const G=ev.groups[k]; G.members=G.members.filter(x=>x!==pid); if(!G.members.length) delete ev.groups[k]; save(a); notify(code);},
    async cleanup(){},
    async deleteEvent(code){const a=all(); delete a[code]; save(a); notify(code);},
    // 主催者が組を決める（ほかの組に入っていた人は、その組から移す）
    async setGroup(code,gid,members){const a=all(), ev=a[code]; if(!ev) return;
      for(const k in ev.groups){if(k!==gid){ev.groups[k].members=ev.groups[k].members.filter(x=>!members.includes(x)); if(!ev.groups[k].members.length) delete ev.groups[k];}}
      if(members.length) ev.groups[gid]={by:'org',members:members.slice()}; else delete ev.groups[gid]; save(a); notify(code);},
    // 主催者による修正（パー・参加者）
    async editPars(code,pars){const a=all(), ev=a[code]; if(!ev) return; ev.pars=pars.slice(); save(a); notify(code);},
    async renamePlayer(code,pid,name){const a=all(), ev=a[code]; if(!ev) return; const p=ev.players.find(x=>x.id===pid); if(p) p.name=name; save(a); notify(code);},
    async addPlayer(code,name){const a=all(), ev=a[code]; if(!ev) return; if(ev.players.length>=MAXP) throw new Error('max');
      const id='p'+(Math.max(0,...ev.players.map(x=>+x.id.slice(1)))+1); ev.players.push({id,name}); save(a); notify(code);},
    async removePlayer(code,pid){const a=all(), ev=a[code]; if(!ev) return; ev.players=ev.players.filter(x=>x.id!==pid);
      const k=grp(ev,pid); if(k){const G=ev.groups[k]; G.members=G.members.filter(x=>x!==pid); if(!G.members.length) delete ev.groups[k];}
      delete ev.scores[pid]; save(a); notify(code);},
    auth:{instant:true,
      onChange(cb){regCb=cb; setTimeout(()=>cb(regGet()),0);},
      isLink(){return false;},
      async sendLink(email){regSet({uid:'demo',label:email});},

    history:{

      async save(uid,rec){L.history.push(rec); saveL(); hnotify();},
      async del(uid,id){L.history=L.history.filter(h=>h.id!==id); saveL(); hnotify();}}
  };
}

function syncLinked(){curEv=null; const lk=L.link; if(!lk) return;

  curEv=ev; const R0=L.local;

  for(let k=0;k<4;k++){const pid=mem[k]; R0.setup.names[k]=pid?pName(ev,pid):'（空き）';}

function cardFor(name,sc,pars,isMe,putts){let gross=0,parSum=0,n=0;
  sc.forEach((g,i)=>{if(g!=null){gross+=g;parSum+=pars[i];n++;}});
  const half=a=>{const idx=[...Array(9)].map((_,j)=>a+j), cnt=idx.filter(i=>sc[i]!=null).length, sum=idx.reduce((t,i)=>t+(sc[i]??0),0);
    return `<div class="scg">${idx.map(i=>`<div class="sh">${i+1}</div>`).join('')}<div class="sh">${a?'IN':'OUT'}</div>
      ${idx.map(i=>`<div class="sp">${pars[i]}</div>`).join('')}<div class="sp">${idx.reduce((t,i)=>t+pars[i],0)}</div>
      ${idx.map(i=>`<div class="sv">${scMark(sc[i]??null,pars[i])}</div>`).join('')}<div class="sv tot">${cnt?sum:''}</div>${putts?(()=>{const pc=idx.filter(i=>putts[i]!=null).length, ps=idx.reduce((t,i)=>t+(putts[i]??0),0);
        return idx.map(i=>`<div class="spt">${putts[i]??''}</div>`).join('')+`<div class="spt tot">${pc?ps:''}</div>`;})():''}</div>`;};
  const d=gross-parSum;
  return `<div class="scard${isMe?' me':''}"><div class="schead"><b>${esc(name)}</b>${isMe?'<span class="mytag">自分</span>':''}
    <span class="sctot">${n?`${d>0?'+'+d:d===0?'±0':d}<small>（${gross}）</small>`:'–'}</span><span class="note">${n}H</span>${putts&&putts.some(v=>v!=null)?`<span class="note">パット${putts.reduce((t,v)=>t+(v??0),0)}</span>`:''}</div>${half(0)}${half(9)}</div>`;}
function rankRows(ev){return ev.players.map(p=>{const sc=(ev.scores[p.id]||Array(HOLES).fill(null)).slice(); let g=0,d=0,n=0;
    sc.forEach((v,i)=>{if(v!=null){g+=v;d+=v-ev.pars[i];n++;}}); return {id:p.id,name:p.name,g,d,n,sc};})
  .filter(r=>r.n>0).sort((a,b)=>a.d-b.d||b.n-a.n);}
function rankHtml(rows,pars,meId){if(!rows.length) return '<div class="note">まだスコアが入っていません。</div>';

  const gl=p=>{const g=groupOf(ev,p.id); return g?`<small>${g}組（${esc(byName(ev,ev.groups[g]))}が選択）</small>`:'';};

  if(!g) return `<section class="card">${evHead(ev)}<div class="ask"><b>${esc(pName(ev,J.me))}</b>さんの組は、まだ決まっていません。</div>
    <div class="note">主催者に組を決めてもらってから、もう一度お試しください。</div><button class="btn ghost" id="joinBack">戻る</button></section>`;
  const G=ev.groups[g];
  return `<section class="card">${evHead(ev)}<div class="ask"><b>${esc(pName(ev,J.me))}</b>さんは<b>${g}組</b>です。この組で参加しますか？</div>
    <div class="note">${g}組：${G.members.map(x=>esc(pName(ev,x))).join('・')}</div>
    ${J.ask?`<div class="confirm joinask"><div><b>入力中のスコアがあります。</b></div>
      ${REG?'':'<div class="note">保存するにはメールアドレスの登録が必要です。「登録して保存」を押すと登録画面に移ります（入力中のスコアはそのまま残ります）。</div>'}
      <button class="btn big" id="${REG?'jSaveJoin':'jRegGo'}">${REG?'保存して参加':'登録して保存'}</button>
      <div class="row"><button class="btn danger" id="jNoSaveJoin">保存せずに参加</button><button class="btn ghost" id="jAskBack">戻る</button></div></div>`
    :`<button class="btn" id="jJoin">参加する</button>`}
    <div class="note">組が違う場合は、主催者に伝えてください。</div>
    <button class="btn ghost" id="joinBack">戻る</button></section>`;}
function vLinkedCard(){const ev=curEv, lk=L.link, G=ev.groups[lk.gid];
  return `<section class="card linked">${evHead(ev)}
    <div><b>${lk.gid}組</b>：${G.members.map(x=>esc(pName(ev,x))).join('・')}</div>
    <div class="note">組の変更は主催者が行います。</div>
  </section>`;}
// 「このスマホでの共有をやめる」は設定画面の一番下に出す
function vLeaveCard(){
  return `<section class="card">${grmAsk==='self'?`<div class="confirm"><div>このスマホでの共有をやめますか？ 組はそのままで、このスマホのスコアも残ります。もう一度IDを入れれば、続きから参加できます。</div><div class="row"><button class="btn danger" id="grmYes">共有をやめる</button><button class="btn ghost" id="grmNo">やめない</button></div></div>`
      :`<button class="btn ghost" id="leaveGrp">このスマホでの共有をやめる</button>`}
  </section>`;}

/* ---------- ギャラリー ---------- */
function vGallery(){const g=L.gal||{}, ev=g.code&&g.ok?Shared.get(g.code):null;
  if(g.code&&g.ok&&!ev&&Shared.status(g.code)==='loading') return loadingCard();
  if(!ev) return `<section class="card"><div class="label">ギャラリー</div><div class="note">IDを入れると、コンペの順位表とスコアカードを見られます。</div>
    <div class="coderow"><input type="text" id="galCode" inputmode="numeric" maxlength="4" placeholder="イベントID" value="${esc(g.code||'')}"><button class="btn" id="galGo">見る</button></div>
    ${galMsg?`<div class="toast warn">${esc(galMsg)}</div>`:''}${galEarly&&IS_DEMO?`<button class="btn ghost" id="galForce">試し用：今すぐ見る</button>`:''}</section>`;
  return `<section class="card">${evHead(ev)}${rankHtml(rankRows(ev),ev.pars,null)}<button class="btn ghost" id="galOut">IDを入れ直す</button></section>`;}

/* ---------- 登録（履歴を残す人だけ） ---------- */
function regCard(title){
  if(!REG){
    if(regStep==='sent') return `<section class="card"><div class="regmsg">確認メールを送りました</div>
      <div class="note">${esc(regMail||'')} に届いたメールの中のリンクを<b>長押しして「リンクをコピー」</b>し、下に貼り付けて「登録する」を押してください。</div>
      ${regMail?'':'<input type="email" id="regMail2" placeholder="メールアドレス" autocomplete="email">'}
      <textarea id="regLinkIn" rows="3" placeholder="ここにリンクを貼り付け">${esc(regLink)}</textarea>
      <button class="btn" id="regDone"${busy?' disabled':''}>登録する</button>
      ${regMsg?`<div class="toast warn">${esc(regMsg)}</div>`:''}
      <button class="btn ghost" id="regRetry">メールアドレスを入れ直す</button></section>`;
    return `<section class="card"><div class="regmsg">${title||'履歴を保存するにはメールアドレスの登録が必要です'}</div>
    <input type="email" id="regMail" placeholder="メールアドレス" autocomplete="email" value="${esc(regMail)}">
    <button class="btn" id="regSend"${busy?' disabled':''}>確認メールを送る</button>
    <div class="or">または</div><button class="btn ghost" id="regGoogle">Googleでログイン</button>
    ${regMsg?`<div class="toast warn">${esc(regMsg)}</div>`:''}
    <div class="note">アドレスは履歴の保存とIDの発行にだけ使います。${IS_DEMO?'試し用のため、今は確認メールは送られず、すぐに登録されます。':''}</div></section>`;}
  return `<section class="card"><div><div class="label">登録中</div><div>${esc(REG.label)}</div></div>
    ${regDel?`<div class="confirm"><div>登録をやめると、保存した履歴もすべて削除されます。元に戻せません。本当にやめますか？</div><div class="row"><button class="btn danger" id="regDelYes">やめて削除する</button><button class="btn ghost" id="regDelNo">戻る</button></div></div>`
      :`<button class="btn danger" id="regDel">登録をやめる（履歴も削除）</button>`}</section>`;}

function bindShared(){const $=id=>document.getElementById(id);
  document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{L.role=b.dataset.role; if(L.role==='gallery') L.view='setup'; saveL(); render();});
  // 主催者
  const o=L.org;
  if($('oDate')){$('oDate').onchange=e=>{o.date=e.target.value;saveL();};
    $('oName').oninput=e=>{o.name=e.target.value;saveL();}; $('oCourse').oninput=e=>{o.course=e.target.value;saveL();};
    const cnt=()=>{const n=orgNames().length, c=$('oCount'); if(c){c.textContent=n+'人'+(n>MAXP?'（40人までです）':''); c.className='note'+(n>MAXP?' warnTxt':'');}};
    document.querySelectorAll('[data-oi]').forEach(x=>{
      x.oninput=e=>{const a=orgLines(); a[+x.dataset.oi]=e.target.value.replace(/\n/g,''); o.names=a.join('\n'); saveL(); cnt();};
      x.onkeydown=e=>{if(e.key!=='Enter'||e.isComposing) return; e.preventDefault(); const i=+x.dataset.oi, a=orgLines();
        if(i+1<a.length){const nx=document.querySelector(`[data-oi="${i+1}"]`); if(nx) nx.focus(); return;}
        if(a.length<MAXP){a.push(''); o.names=a.join('\n'); saveL(); orgFocus=a.length-1; render();}};});
    document.querySelectorAll('[data-orm]').forEach(b=>b.onclick=()=>{const a=orgLines(); a.splice(+b.dataset.orm,1); o.names=a.join('\n'); saveL(); render();});
    if($('oAddRow')) $('oAddRow').onclick=()=>{const a=orgLines(); if(a.length>=MAXP) return; a.push(''); o.names=a.join('\n'); saveL(); orgFocus=a.length-1; render();};
    if(orgFocus!=null){const f=document.querySelector(`[data-oi="${orgFocus}"]`); orgFocus=null; if(f){f.focus(); f.scrollIntoView({block:'center'});}}
    document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{const i=+b.dataset.op; o.pars[i]=o.pars[i]===4?5:o.pars[i]===5?3:4; saveL(); render();});
    $('oIssue').onclick=async()=>{if(busy) return; const names=orgNames(); orgMsg='';
      if(!o.date) orgMsg='開催日を入れてください。'; else if(!o.course.trim()) orgMsg='ゴルフ場名を入れてください。';
      else if(names.length<2) orgMsg='参加者を2人以上入れてください。'; else if(names.length>MAXP) orgMsg='参加者は40人までです。';
      else if(new Set(names).size!==names.length) orgMsg='同じ名前が2回入っています。区別できるように名前を変えてください。';
      else if(evEnd({date:o.date})<Date.now()) orgMsg='開催日が過ぎています。日付を確かめてください。';
      if(orgMsg){render();return;}
      busy=true; render();
      try{const code=await B.createEvent({date:o.date,name:o.name.trim(),course:o.course.trim(),pars:o.pars,players:names});
        L.myEvents=myEvents().concat([{code,end:evEnd({date:o.date}),n:names.length}]); L.org=null; saveL(); toast=`ID「${code}」を発行しました。`; window.scrollTo(0,0);}
      catch(e){orgMsg='発行できませんでした。電波の良い所でもう一度お試しください。';}
      busy=false; render();};}
  document.querySelectorAll('[data-gnew]').forEach(b=>b.onclick=()=>{const ev=Shared.get(b.dataset.gnew); if(!ev) return;
    orgPick={code:ev.code,gid:String(Math.max(0,...Object.keys(ev.groups).map(Number))+1),sel:[]}; render();});
  document.querySelectorAll('[data-gedit]').forEach(b=>b.onclick=()=>{const [code,g]=b.dataset.gedit.split('|'), ev=Shared.get(code); if(!ev) return;
    orgPick={code,gid:g,sel:ev.groups[g].members.slice()}; render();});
  document.querySelectorAll('[data-gsel]').forEach(b=>b.onclick=()=>{const p=b.dataset.gsel, sel=orgPick.sel;
    if(sel.includes(p)) orgPick.sel=sel.filter(x=>x!==p); else if(sel.length<4) sel.push(p); else toast='1つの組は4人までです。'; render();});
  if($('gCancel')) $('gCancel').onclick=()=>{orgPick=null; render();};
  if($('gSave')) $('gSave').onclick=()=>{const {code,gid,sel}=orgPick; orgPick=null;
    B.setGroup(code,gid,sel).then(()=>{toast=sel.length?`${gid}組を決めました。`:`${gid}組をなくしました。`; render();}).catch(()=>{toast='組を決められませんでした。このIDを発行した人のスマホから、電波の良い所でお試しください。'; render();}); render();};
  if($('ormNo')) $('ormNo').onclick=()=>{ormAsk=null;render();};
  document.querySelectorAll('[data-evdel]').forEach(b=>b.onclick=()=>{evDelAsk=b.dataset.evdel; render();});
  if($('evDelNo')) $('evDelNo').onclick=()=>{evDelAsk=null; render();};
  if($('evDelYes')) $('evDelYes').onclick=()=>{const code=evDelAsk; evDelAsk=null; if(orgEdit===code) orgEdit=null; if(orgPick&&orgPick.code===code) orgPick=null;
    B.deleteEvent(code).then(()=>{L.myEvents=myEvents().filter(e=>e.code!==code); saveL(); toast=`イベント（ID ${code}）を削除しました。`; render();})
      .catch(e=>{toast='削除できませんでした。このIDを発行した人のスマホから、電波の良い所でお試しください。'+errCode(e); render();}); render();};
  document.querySelectorAll('[data-oedit]').forEach(b=>b.onclick=()=>{orgEdit=b.dataset.oedit; prmAsk=null; render();});
  if($('eDone')) $('eDone').onclick=()=>{orgEdit=null; prmAsk=null; render();};
  const eev=orgEdit&&Shared.get(orgEdit), edErr=()=>{toast='直せませんでした。このIDを発行したスマホからのみ直せます。電波も確かめてください。'; render();};
  if(eev){
    document.querySelectorAll('[data-ep]').forEach(b=>b.onclick=()=>{const i=+b.dataset.ep, ps=eev.pars.slice(); ps[i]=ps[i]===4?5:ps[i]===5?3:4; B.editPars(eev.code,ps).catch(edErr);});
    document.querySelectorAll('[data-ern]').forEach(inp=>inp.onchange=()=>{const n=inp.value.trim(), pid=inp.dataset.ern;
      if(!n){toast='名前を入れてください。'; render(); return;}
      if(eev.players.some(x=>x.id!==pid&&x.name===n)){toast='同じ名前の人がいます。区別できるように名前を変えてください。'; render(); return;}
      B.renamePlayer(eev.code,pid,n).catch(edErr);});
    document.querySelectorAll('[data-erm]').forEach(b=>b.onclick=()=>{prmAsk=b.dataset.erm; render();});
    if($('prmNo')) $('prmNo').onclick=()=>{prmAsk=null; render();};
    if($('prmYes')) $('prmYes').onclick=()=>{const pid=prmAsk; prmAsk=null; B.removePlayer(eev.code,pid).then(()=>{toast='削除しました。';render();}).catch(edErr); render();};
    if($('eAddBtn')) $('eAddBtn').onclick=()=>{const n=($('eAdd').value||'').trim(); if(!n) return;
      if(eev.players.some(x=>x.name===n)){toast='同じ名前の人がいます。区別できるように名前を変えてください。'; render(); return;}
      B.addPlayer(eev.code,n).then(()=>{toast=`${n}さんを追加しました。`; render();}).catch(edErr);};
  }
  if($('ormYes')) $('ormYes').onclick=()=>{const [code,pid]=ormAsk.split('|'); ormAsk=null; B.removeFromGroup(code,pid).catch(netErr); render();};
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const t=b.dataset.copy, w=b.dataset.what||'URL';
    const ng=()=>{toast=`コピーできませんでした。${w==='ID'?'IDの数字':'URL'}を書き写して送ってください。${w==='URL'?'（'+t+'）':''}`;render();};
    try{navigator.clipboard.writeText(t).then(()=>{toast=`${w}をコピーしました。LINEなどに貼り付けられます。`;render();},ng);}catch(e){ng();}});
  // プレーヤー
  if($('toJoin')) $('toJoin').onclick=()=>{L.pmode='code'; saveL(); render();};
  if($('soloGo')) $('soloGo').onclick=()=>{L.pmode='solo'; saveL(); render();};
  if($('joinGo')) $('joinGo').onclick=async()=>{if(busy) return; const c=($('joinCode').value||'').replace(/\D/g,''); J.code=c; J.msg=''; J.early=false;
    if(c.length!==4){J.msg='イベントIDを確かめてください。'; render(); return;}
    busy=true; render(); const ev=await Shared.load(c); busy=false;
    if(!ev){J.msg='IDが見つかりません。数字を確かめてください。'; render(); return;}
    if(Date.now()<evStart(ev)){J.msg=`このコンペは${fmtD(ev.date)}から参加できます。`; J.early=true; render(); return;}
    J.step='name'; render();};
  if($('joinForce')) $('joinForce').onclick=()=>{J.msg='';J.early=false;J.step='name';render();};
  if($('joinBack')) $('joinBack').onclick=()=>{J.step=J.step==='name'?'code':'name'; render();};
  document.querySelectorAll('[data-jme]').forEach(b=>b.onclick=()=>{J.me=b.dataset.jme; J.picks=[]; J.step='confirm'; render();});
  const jGo=()=>{const ev=Shared.get(J.code), g=ev&&groupOf(ev,J.me); J.ask=false; if(g) linkTo(ev,g,J.me);};
  if($('jJoin')) $('jJoin').onclick=()=>{if(localHasScores()){J.ask=true; render();} else jGo();};
  if($('jAskBack')) $('jAskBack').onclick=()=>{J.ask=false; render();};
  if($('jNoSaveJoin')) $('jNoSaveJoin').onclick=jGo;
  if($('jRegGo')) $('jRegGo').onclick=()=>setTab('hist');
  if($('jSaveJoin')) $('jSaveJoin').onclick=async()=>{R=L.local; if(await saveHistory()){jGo(); toast='入力中のスコアを履歴に保存して参加しました。'; render();} else render();};
  if($('jWrong')) $('jWrong').onclick=async()=>{busy=true; render(); try{await B.removeFromGroup(J.code,J.me); J.step='pick'; J.picks=[];}catch(e){netErr();} busy=false; render();};
  document.querySelectorAll('[data-jpk]').forEach(b=>b.onclick=()=>{const p=b.dataset.jpk;
    if(J.picks.includes(p)) J.picks=J.picks.filter(x=>x!==p); else if(J.picks.length<3) J.picks.push(p); else toast='同じ組に選べるのは3人までです。'; render();});
  if($('jStart')) $('jStart').onclick=async()=>{if(busy) return; busy=true; render(); let res=null;
    try{res=await B.createGroup(J.code,J.me,J.picks);}catch(e){busy=false; netErr(); return;}
    busy=false; const ev=await Shared.load(J.code);
    if(!res||res.missing||!ev){J={step:'code',code:'',msg:'IDが見つかりません。期限が切れた可能性があります。',early:false,me:null,picks:[]}; render(); return;}
    if(res.already){J.step='confirm'; render(); return;}
    if(res.taken){toast=`${res.taken.map(p=>pName(ev,p)).join('・')}さんは、ほかの組に選ばれました。選び直してください。`; J.picks=J.picks.filter(p=>!res.taken.includes(p)); render(); return;}
    if(!ev.groups[res.gid]) ev.groups[res.gid]={by:J.me,members:[J.me,...J.picks]};
    linkTo(ev,res.gid,J.me);};
  document.querySelectorAll('[data-grm]').forEach(b=>b.onclick=()=>{grmAsk=b.dataset.grm; render();});
  if($('leaveGrp')) $('leaveGrp').onclick=()=>{grmAsk='self'; render();};
  if($('grmNo')) $('grmNo').onclick=()=>{grmAsk=null;render();};
  if($('grmYes')) $('grmYes').onclick=()=>{L.link=null; L.pmode='code'; saveL(); toast='このスマホでの共有をやめました。'; grmAsk=null; render();};
  // ギャラリー
  if($('galGo')) $('galGo').onclick=async()=>{const c=($('galCode').value||'').replace(/\D/g,''); galMsg=''; galEarly=false; L.gal={code:c,ok:false};
    const ev=c.length===4?await Shared.load(c):null; if(!ev) galMsg='IDが見つかりません。数字を確かめてください。';
    else if(Date.now()<evStart(ev)){galMsg=`このコンペは${fmtD(ev.date)}から見られます。`; galEarly=true;} else L.gal.ok=true;
    saveL(); render();};
  if($('galForce')) $('galForce').onclick=()=>{L.gal.ok=true; galMsg=''; galEarly=false; saveL(); render();};
  if($('galOut')) $('galOut').onclick=()=>{L.gal={code:'',ok:false}; rankOpen=null; saveL(); render();};
  document.querySelectorAll('[data-rk]').forEach(b=>b.onclick=()=>{rankOpen=rankOpen===b.dataset.rk?null:b.dataset.rk; render();});
  // 登録
  const okReg=()=>{regMsg=''; regStep=null; regLink=''; toast='登録しました。これから保存するラウンドは履歴に残ります。'; render();};
  if($('regSend')) $('regSend').onclick=async()=>{const m=($('regMail').value||'').trim(); regMail=m;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){regMsg='メールアドレスを確かめてください。'; render(); return;}
    busy=true; render();
    try{await B.auth.sendLink(m); regMsg=''; if(B.auth.instant) okReg(); else {regStep='sent'; render();}}
    catch(e){regMsg='確認メールを送れませんでした。アドレスを確かめて、もう一度お試しください。'; render();}
    busy=false; render();};
  if($('regDone')) $('regDone').onclick=async()=>{const link=($('regLinkIn').value||'').trim(), m=regMail||(($('regMail2')||{}).value||'').trim();
    if(!B.auth.isLink(link)){regMsg='貼り付けたリンクを確かめてください。メールの中のリンクを長押ししてコピーします。'; regLink=link; render(); return;}
    if(!m){regMsg='メールアドレスを入れてください。'; regLink=link; render(); return;}
    busy=true; render(); try{await B.auth.completeLink(m,link); busy=false; okReg();}catch(e){busy=false; regMsg='登録できませんでした。リンクの期限が切れているか、すでに使われています。もう一度確認メールを送ってください。'; render();}};
  if($('regRetry')) $('regRetry').onclick=()=>{regStep=null; regMsg=''; regLink=''; render();};
  if($('regGoogle')) $('regGoogle').onclick=async()=>{try{await B.auth.google(); okReg();}catch(e){regMsg='Googleでログインできませんでした。メールアドレスで登録してください。'; render();}};
  if($('regDel')) $('regDel').onclick=()=>{regDel=true;render();};
  if($('regDelNo')) $('regDelNo').onclick=()=>{regDel=false;render();};
  if($('regDelYes')) $('regDelYes').onclick=async()=>{regDel=false; histOpen=null; const uid=REG&&REG.uid;
    let r=null; try{r=await B.auth.deleteAccount(uid);}catch(e){}
    toast=r&&r.ok?'登録をやめて、履歴を削除しました。':(r&&r.relogin?'履歴は削除しました。登録の取り消しを終えるには、もう一度ログインしてから「登録をやめる」を押してください。':'削除できませんでした。電波の良い所でもう一度お試しください。'); render();};
  if($('regGo')) $('regGo').onclick=()=>{endStep=null; setTab('hist');};
}
// このスマホで発行したイベントのうち、期限が過ぎたものを共有データから消す
setTimeout(()=>{const now=Date.now(), old=(L.myEvents||[]).filter(e=>typeof e==='object'&&e.end&&now>e.end);
  old.forEach(e=>B.cleanup(e.code).catch(()=>{}));
  if(old.length){L.myEvents=myEvents(); saveL();}},3000);

function vSetupAll(){
  if(L.role==='organizer') return roleCard()+vOrg();
  if(L.role==='gallery') return roleCard()+vGallery();
  if(!L.link&&L.pmode!=='solo') return roleCard()+vJoin();
  return roleCard()+(L.link?(curEv?vLinkedCard():loadingCard('共有データを読み込み中…')):`<section class="card"><button class="btn ghost" id="toJoin">IDで参加する</button></section>`)+vSetup()+(L.link&&curEv?vLeaveCard():'');}
function vHist(){if(!REG) return regCard(); return vHistInner()+(histOpen?'':regCard());}


/* ---------- 使い方 ---------- */
let helpFrom='setup';
function vHelp(){
  const sec=(t,body,open)=>`<details class="hsec"${open?' open':''}><summary>${t}</summary><div class="hbody">${body}</div></details>`;
  return `<section class="card helpv">
  <div class="row" style="justify-content:space-between"><b class="htitle">使い方</b><button class="btn ghost" id="helpBack">← 戻る</button></div>
  ${sec('1. このアプリでできること',`
    <p>ゴルフのスコアを入れると、ラスベガスやマッチプレーの点数、コンペの順位を自動で出します。設定画面の一番上で、役割を選びます。</p>
    <dl>
      <dt>主催者</dt><dd>コンペを登録してイベントIDを発行。パー・参加者・組み合わせを決める（メールアドレスの登録が必要）。</dd>
      <dt>プレーヤー</dt><dd>イベントIDを入れて自分の名前を選び、スコアを入れる。IDを使わず「単体で始める」こともできる。</dd>
      <dt>ギャラリー</dt><dd>イベントIDを入れると、順位表とスコアカードを見られる。</dd>
    </dl>`,true)}
  ${sec('2. ホーム画面に追加する',`
    <p>追加すると、アイコンから開けて、電波がない所でも使えます。<b>次からは必ずアイコンから開いてください。</b></p>
    <dl>
      <dt>iPhone</dt><dd>Safariで開く → 共有ボタン（□に↑）→「ホーム画面に追加」。LINEから開いた時は、右下の「…」→「Safariで開く」を先に。</dd>
      <dt>Android</dt><dd>Chromeで開く → 右上の「︙」→「ホーム画面に追加」。</dd>
    </dl>`)}
  ${sec('3. スコアの入れ方と集計',`
    <p><b>スコア</b>：◀▶でホールを移動し、＋−で打数を入れる。最初に押すとパーの数になる。名前の横に「パー」「ボギー」などが出るので、パーの入れ間違いに気づける。</p>
    <p><b>集計</b>：スコアカードの記号は　—パー　△ボギー　□ダブルボギー　○バーディー　◎イーグル。+3以上は数字。名前の横の「+25（97）」は、パーとの差（合計スコア）。</p>
    <p><b>パット数</b>：設定で「記録する」にすると、自分の分だけ入れられます。スコアカードの記号の下に出ます。</p>`)}
  ${sec('4. ラスベガスのルール',`
    <p>2人ずつのチームで対戦。ハンデを引いたスコアの良い方が「前」、悪い方が「後」。</p>
    <ul>
      <li><b>前</b>：前同士の差がそのまま点数</li>
      <li><b>後</b>：前で勝ったチームが後も勝てば+1。前が同点なら、後で勝ったチームに+1</li>
      <li><b>バーディー</b>：相手チームの前と後が入れ替わり、取った人のチームに+1</li>
      <li><b>ニアピン</b>：+1。<b>倍率</b>：そのホールの点数を2倍などに。<b>持ち越し</b>：前のホールが同点の時、勝ったチームに足す</li>
      <li>ハンデを引いてもパーより良くはならない</li>
    </ul>
    <p class="ex"><b>例</b>　Aチーム 4と5、Bチーム 5と6 → 前は4対5でA+1、後も5対6でA+1 → <b>Aが+2</b></p>
    <p class="ex"><b>例</b>　パー4で、Aチーム 3と5、Bチーム 4と6 → Aのバーディーで、Bは前6・後4に入れ替え。前は3対6でA+3、後は5対4でAが負けたので0、バーディー賞+1 → <b>Aが+4</b></p>`)}
  ${sec('5. マッチプレーの見方',`
    <p>自分と相手の1対1で、ホールごとに勝ち負けを数えます。</p>
    <dl>
      <dt>アップ／ダウン</dt><dd>何ホール勝ち越し／負け越しているか</dd>
      <dt>オールスクエア</dt><dd>同点</dd>
      <dt>ドーミー</dt><dd>差と残りホール数が同じ（次に負けなければ勝ち）</dd>
      <dt>3&amp;2</dt><dd>残り2ホールで3アップになり、勝ちが決まった</dd>
    </dl>`)}
  ${sec('6. 登録と履歴',`
    <p>履歴を残すのと、主催者としてIDを発行するには、メールアドレスの登録が必要です（「履歴」タブから）。</p>
    <p>登録は、<b>ホーム画面のアイコンから開いたアプリ</b>で行ってください。iPhoneでは、確認メールのリンクを<b>押さずに長押しでコピー</b>して、アプリに貼り付けます。</p>
    <p>登録すると、機種変更しても同じアドレスで履歴を見られます。</p>
    <p>ラウンドが終わったら、設定か集計の一番下「ラウンドを終了する」→「保存して終了」。</p>`)}
  ${sec('7. よくある質問',`
    <dl class="faq">
      <dt>途中でアプリを閉じてしまった</dt><dd>IDで参加中なら、もう一度IDを入れて自分の名前を選べば続きから入力できる。</dd>
      <dt>組が違う</dt><dd>組の変更は主催者が行う。主催者に伝える。</dd>
      <dt>2人・3人の組</dt><dd>ラスベガスは「しない」にする。単体で使う時は、使わない欄の名前を消す。</dd>
      <dt>共有データはいつ消える？</dt><dd>開催日の0時から48時間。残したい人は、その前に「保存して終了」。</dd>
      <dt>同じ組で2人が入力したら？</dt><dd>後から入れた数字が使われる。</dd>
    </dl>`)}
  </section>`;}

function mpSet(f){const mp=clone(R.setup.mp); f(mp); mutate(r=>r.setup.mp=clone(mp),{setup:{mp}});}
function bindMp(){const $=id=>document.getElementById(id);
  if($('oppSel')) $('oppSel').onclick=e=>{const b=e.target.closest('[data-o]'); if(!b) return; const k=+b.dataset.o;
    mpSet(mp=>mp.opps=mp.opps.includes(k)?mp.opps.filter(x=>x!==k):mp.opps.concat([k]).sort());};
  if($('extAdd')) $('extAdd').onclick=()=>mpSet(mp=>{const id=Math.max(3,...mp.ext,...Object.keys(mp.names).map(Number))+1;
    mp.ext.push(id); mp.names[id]='場外'+mp.ext.length; mp.xs[id]=Array(HOLES).fill(null); extOpen=null;});
  R.setup.mp.ext.forEach(id=>{const el=$('ename'+id); if(el) el.onchange=e=>mpSet(mp=>mp.names[id]=e.target.value);});
  document.querySelectorAll('[data-eopen]').forEach(b=>b.onclick=()=>{const id=+b.dataset.eopen; extOpen=extOpen===id?null:id; render();});
  document.querySelectorAll('[data-edel]').forEach(b=>b.onclick=()=>{extDel=+b.dataset.edel; render();});
  if($('extDelNo')) $('extDelNo').onclick=()=>{extDel=null;render();};
  if($('extDelYes')) $('extDelYes').onclick=()=>{const id=extDel; extDel=null; if(extOpen===id) extOpen=null;
    mpSet(mp=>{mp.ext=mp.ext.filter(x=>x!==id); delete mp.names[id]; delete mp.xs[id]; delete mp.mh[id]; if(mp.lk) delete mp.lk[id];});};
  document.querySelectorAll('[data-bk]').forEach(b=>b.onclick=()=>{const k=+b.dataset.bk, i=+b.dataset.bi, g=mpSc(i,k), par=R.holes[i].par;
    mpSet(mp=>{const a=mp.xs[k]||(mp.xs[k]=Array(HOLES).fill(null)); a[i]=g==null?par:Math.max(1,g+(+b.dataset.d));});});
  document.querySelectorAll('[data-mw]').forEach(g=>g.onclick=e=>{const b=e.target.closest('[data-v]'); if(!b) return; const o=g.dataset.mw;
    mpSet(mp=>{const h=mp.mh[o]&&mp.mh[o].v?mp.mh[o]:(mp.mh[o]={who:'none',v:{3:0,4:0,5:0}}); h.who=b.dataset.v;});});
  document.querySelectorAll('[data-mo]').forEach(b=>b.onclick=()=>mpSet(mp=>{const h=mp.mh[b.dataset.mo]; if(h) h.v[b.dataset.hp]=Math.max(0,(Number(h.v[b.dataset.hp])||0)+(+b.dataset.d));}));
  document.querySelectorAll('[data-mm]').forEach(g=>g.onclick=e=>{const b=e.target.closest('[data-m]'); if(!b) return; const o=g.dataset.mm;
    mpSet(mp=>{const h=mp.mh[o]; if(h){h.mode=b.dataset.m; if(!h.holes) h.holes=[];}});});
  document.querySelectorAll('[data-mhh]').forEach(b=>b.onclick=()=>{const o=b.dataset.mhh, i=+b.dataset.hi;
    mpSet(mp=>{const h=mp.mh[o]; if(!h) return; const hs=h.holes||[]; h.holes=hs.includes(i)?hs.filter(x=>x!==i):hs.concat([i]).sort((a,b)=>a-b);});});
  document.querySelectorAll('[data-lkadd]').forEach(b=>b.onclick=()=>mpSet(mp=>{const pid=b.dataset.lkadd, id=Math.max(3,...mp.ext,...Object.keys(mp.names).map(Number))+1;
    mp.ext.push(id); mp.names[id]=pName(curEv,pid); mp.xs[id]=Array(HOLES).fill(null); (mp.lk||(mp.lk={}))[id]=pid;}));
  if($('mpCap')) $('mpCap').onclick=e=>{const b=e.target.closest('[data-c]'); if(b) mpSet(mp=>mp.cap=b.dataset.c==='1');};
}
function bind(){
  const $=id=>document.getElementById(id);
  bindShared();
  if($('helpBack')) $('helpBack').onclick=()=>{L.view=helpFrom||'setup'; saveL(); render(); window.scrollTo(0,0);};
  if(toast){const t=toast; setTimeout(()=>{if(toast===t){toast='';render();}},4000);}
  if($('endBtn')) $('endBtn').onclick=()=>{endStep='ask';render();const a=$('roundArea');if(a)a.scrollIntoView({block:'end'});};
  if($('endBack')) $('endBack').onclick=()=>{endStep=null;render();};
  if($('saveEnd')) $('saveEnd').onclick=()=>finishRound(true);
  if($('discardEnd')) $('discardEnd').onclick=()=>{endStep='discard';render();};
  if($('discardYes')) $('discardYes').onclick=()=>finishRound(false);
  if(L.view==='setup'){
    if($('shareBtn')) $('shareBtn').onclick=createShared;
    document.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>joinRound(b.dataset.join));
    if(!$('course')) return;
    $('rdate').onchange=e=>{const v=e.target.value||''; mutate(r=>r.setup.date=v,{setup:{date:v}});};
    $('course').onchange=e=>mutate(r=>r.setup.course=e.target.value,{setup:{course:e.target.value}});
    [0,1,2,3].forEach(k=>$('name'+k).onchange=e=>mutate(r=>r.setup.names[k]=e.target.value,{setup:{names:R.setup.names.map((n,j)=>j===k?e.target.value:n)}}));
    document.querySelectorAll('input[name=mode]').forEach(x=>x.onchange=e=>mutate(r=>r.setup.mode=e.target.value,{setup:{mode:e.target.value}}));
    const fp=$('fixedP'); if(fp) fp.onclick=e=>{const b=e.target.closest('[data-p]'); if(b) mutate(r=>r.setup.fixedPartner=+b.dataset.p,{setup:{fixedPartner:+b.dataset.p}});};
    if($('split')) $('split').onclick=e=>{const b=e.target.closest('[data-s]'); if(!b) return; const on=b.dataset.s==='1';
      const s=R.setup, n={split:on}; if(on&&!s.split){n.hcp2=s.hcp.slice(); n.hcpPar2=clone(s.hcpPar);}
      mutate(r=>Object.assign(r.setup,clone(n)),{setup:n});};
    document.querySelectorAll('[data-hcp]').forEach(g=>g.onclick=e=>{const b=e.target.closest('[data-hv]'); if(!b) return;
      const f=g.dataset.half==='1'?'hcp2':'hcp', arr=R.setup[f].slice(); arr[+g.dataset.hcp]=b.dataset.hv;
      mutate(r=>r.setup[f]=arr.slice(),{setup:{[f]:arr}});});
    document.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{const f=b.dataset.half==='1'?'hcpPar2':'hcpPar', arr=clone(R.setup[f]), p=b.dataset.pp, k=+b.dataset.pk;
      arr[k][p]=Math.max(0,(Number(arr[k][p])||0)+(+b.dataset.d)); mutate(r=>r.setup[f]=clone(arr),{setup:{[f]:arr}});});
    if($('ordStart')) $('ordStart').onclick=()=>{ordPick=[];render();};
    if($('ordCancel')) $('ordCancel').onclick=()=>{ordPick=null;render();};
    document.querySelectorAll('[data-ord]').forEach(b=>b.onclick=()=>{ordPick.push(+b.dataset.ord); const act=ordActive();
      if(ordPick.length===act.length-1) ordPick.push(act.find(k=>!ordPick.includes(k)));
      if(ordPick.length>=act.length){ordPick=ordPick.concat([0,1,2,3].filter(k=>!ordPick.includes(k)));}
      if(ordPick.length===4){const o=ordPick.slice(); ordPick=null; mutate(r=>{r.setup.order=o.slice();r.setup.orderSet=true;},{setup:{order:o,orderSet:true}});} else render();});
    $('meSel').onclick=e=>{const b=e.target.closest('[data-me]'); if(!b) return; const v=b.dataset.me===''?null:+b.dataset.me; mutate(r=>r.setup.me=v,{setup:{me:v}});};
    if($('puttSel')) $('puttSel').onclick=e=>{const b=e.target.closest('[data-pt]'); if(!b) return; const v=b.dataset.pt==='1'; mutate(r=>r.setup.puttOn=v,{setup:{puttOn:v}});};
    // ラスベガス・マッチプレーの設定を開く／閉じる（一度開くと、ボタンは普通の色に戻る）
    document.querySelectorAll('#lvOn [data-on],#mpOn [data-on]').forEach(b=>b.onclick=()=>{const f=b.closest('.onoff').id==='lvOn'?'lvOn':'mpOn', v=b.dataset.on==='1';
      mutate(r=>r.setup[f]=v,{setup:{[f]:v}});});
    $('lvToggle').onclick=()=>{lvOpen=!lvOpen; if(lvOpen&&!R.setup.lvSeen) mutate(r=>r.setup.lvSeen=true,{setup:{lvSeen:true}}); else render();};
    $('mpToggle').onclick=()=>{mpOpen=!mpOpen; if(mpOpen&&!R.setup.mpSeen) mutate(r=>r.setup.mpSeen=true,{setup:{mpSeen:true}}); else render();};
    $('go').onclick=()=>setTab('hole');
    bindMp();
  } else if(L.view==='hole'){
    if(!$('prev')) return;
    const i=L.cur, H=R.holes[i];
    if($('ordGo')) $('ordGo').onclick=()=>{setTab('setup'); window.scrollTo(0,0);};
    $('prev').onclick=()=>{L.cur--;saveL();render();};
    $('next').onclick=()=>{L.cur++;saveL();render();};
    if($('par')) $('par').onclick=e=>{const b=e.target.closest('[data-par]'); if(b) mutate(r=>r.holes[i].par=+b.dataset.par,holePatch(i,{par:+b.dataset.par}));};
    $('players').onclick=e=>{const h=e.target.closest('[data-hk]');
      if(h){const k=+h.dataset.hk, v=Math.max(0,(Number(H.h[k])||0)+(+h.dataset.d)); mutate(r=>r.holes[i].h[k]=v,holePatch(i,{h:{[k]:v}}));return;}
      const b=e.target.closest('[data-k]'); if(!b) return; const k=+b.dataset.k,d=+b.dataset.d;
      const v=H.s[k]==null?H.par:Math.max(1,H.s[k]+d);
      if(L.link&&curEv){const pid=L.link.members&&L.link.members[k]; if(!pid) return; Shared.setScore(L.link.code,pid,i,v);}
      mutate(r=>r.holes[i].s[k]=v,holePatch(i,{s:{[k]:v}}));};
    document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const f=b.dataset.x,d=+b.dataset.d;
      const v=f==='carry'?Math.max(0,(Number(H.carry)||0)+d):Math.max(1,(Number(H.mult)||1)+d);
      mutate(r=>r.holes[i][f]=v,holePatch(i,{[f]:v}));});
    if($('putt')) $('putt').onclick=e=>{const b=e.target.closest('[data-pd]'); if(!b) return; const v=H.putt==null?2:Math.max(0,H.putt+(+b.dataset.pd)); mutate(r=>r.holes[i].putt=v,holePatch(i,{putt:v}));};
    if($('np')) $('np').onclick=e=>{const b=e.target.closest('[data-np]'); if(!b) return; const v=b.dataset.np===''?null:+b.dataset.np; mutate(r=>r.holes[i].np=v,holePatch(i,{np:v}));};
    const kp=$('kanP'); if(kp) kp.onclick=e=>{const b=e.target.closest('[data-p]'); if(b) mutate(r=>r.holes[i].partner=+b.dataset.p,holePatch(i,{partner:+b.dataset.p}));};
  } else if(L.view==='sum'){
    document.querySelectorAll('[data-go]').forEach(tr=>tr.onclick=()=>{L.cur=+tr.dataset.go;setTab('hole');});
  } else {
    document.querySelectorAll('[data-hist]').forEach(b=>b.onclick=()=>{histOpen=b.dataset.hist;histDel=null;render();});
    if($('histBack')) $('histBack').onclick=()=>{histOpen=null;histDel=null;render();};
    if($('delBtn')) $('delBtn').onclick=()=>{histDel=histOpen;render();};
    if($('delNo')) $('delNo').onclick=()=>{histDel=null;render();};
    if($('delYes')) $('delYes').onclick=async()=>{const rec=allHistory().find(h=>h.id===histOpen);
      if(rec&&REG){try{await B.history.del(REG.uid,rec.id);}catch(e){toast='削除できませんでした。';}}
      histOpen=null;histDel=null;if(!toast)toast='記録を削除しました。';render();};
    if($('copyBtn')) $('copyBtn').onclick=()=>{const ta=$('copyText'),txt=ta.value;
      const fb=()=>{ta.hidden=false;ta.select();toast='文字を選択しました。長押しでコピーしてください。';render();};
      try{navigator.clipboard.writeText(txt).then(()=>{toast='コピーしました。LINEなどに貼り付けられます。';render();},fb);}catch(e){fb();}};
  }
}
if(L.pmode===undefined) L.pmode=localHasScores()?'solo':'code';
// ID入りのURL（…#4821）で開いたら、そのまま参加の画面へ
{const hm=(location.hash||'').match(/^#(\d{4})$/); if(hm&&!(L.link&&L.link.code===hm[1])){L.role='player'; L.pmode='code'; J.code=hm[1]; L.view='setup'; saveL();}}
// iPhoneでダブルタップしても画面が拡大しないようにする（2回目のタップはボタンを押したことにする）
(()=>{let last=0;
  document.addEventListener('touchend',e=>{const now=Date.now(), quick=now-last<350; last=now;
    if(!quick||e.touches.length) return; const t=e.target;
    if(t.closest&&t.closest('input,textarea,select,[contenteditable]')) return;
    e.preventDefault(); const c=t.closest&&t.closest('button,a,label,summary'); if(c) c.click();},{passive:false});})();
document.getElementById('helpBtn').onclick=()=>{if(L.view!=='help') helpFrom=L.view; L.view='help'; render(); window.scrollTo(0,0);};
render();

if(L.roundId){L.roundId=null;saveL();}
</script>

<script>
// 電波がなくても開けるようにする仕組み（サービスワーカー）
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
